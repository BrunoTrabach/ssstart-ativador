name: Build Ativador
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug
      
      - name: Salvar APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/SSStart-Ativador.apk
      
      - name: Commit APK
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: APK Ativador [skip ci]"
          file_pattern: release/*.apk
